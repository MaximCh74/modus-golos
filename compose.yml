# Запуск одной командой: docker compose up --build  →  http://localhost:8090
# Порт снаружи — MF_PORT в .env (по умолчанию 8090). База и вложения — в именованном томе mf_data.
services:
  mf:
    build: .
    ports:
      - "${MF_PORT:-8090}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      MF_DATA_DIR: /data        # база и вложения — в томе, что бы ни стояло в .env
      MF_DEMO_SNAPSHOT: "1"     # первый запуск: пустая база заполняется демо-снапшотом сама
    volumes:
      - mf_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 6s
      retries: 5
      start_period: 30s
volumes:
  mf_data: {}
